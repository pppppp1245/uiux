<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>이용약관</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .popup-header { border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .footer { margin-top: 20px; text-align: center; }
        button { cursor: pointer; padding: 8px 16px; }
    </style>
</head>
<body>
    <div class="popup-header">
        <h2>이용약관</h2>
    </div>
    <div class="content">
        <p>본 약관은 서비스 이용과 관련된 제반 사항을 규정합니다...</p>
    </div>
    <div class="footer">
        <!-- 팝업 창을 닫는 자바스크립트 -->
        <button onclick="window.close()">창 닫기</button>
    </div>
    
    <!-- 관련 페이지 -->
    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
        <h4 style="margin-bottom: 15px; font-size: 14px; color: #666;">🔗 관련 UI 컴포넌트</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <a href="index.html#alert" target="_parent" style="display: block; padding: 8px; background: #f5f5f5; border-radius: 6px; text-decoration: none; color: #333; font-size: 13px; text-align: center;">
                🔔 알럿 (Alert)
            </a>
            <a href="index.html#toast" target="_parent" style="display: block; padding: 8px; background: #f5f5f5; border-radius: 6px; text-decoration: none; color: #333; font-size: 13px; text-align: center;">
                🍞 토스트 (Toast)
            </a>
            <a href="index.html#bottomsheet" target="_parent" style="display: block; padding: 8px; background: #f5f5f5; border-radius: 6px; text-decoration: none; color: #333; font-size: 13px; text-align: center;">
                📱 바텀시트 (Bottom Sheet)
            </a>
            <a href="index.html#slider" target="_parent" style="display: block; padding: 8px; background: #f5f5f5; border-radius: 6px; text-decoration: none; color: #333; font-size: 13px; text-align: center;">
                🎚️ 슬라이더 (Slider)
            </a>
        </div>
    </div>
</body>
</html>
